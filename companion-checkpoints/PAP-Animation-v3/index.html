<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PAP · Animationsvorschau</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#16111d; color:#eee3dc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:radial-gradient(ellipse at 50% 43%,#302033 0,#19131f 43%,#100d15 100%); }
    main { max-width:790px; margin:auto; padding:48px 24px 36px; }
    header { text-align:center; }
    .eyebrow { font-size:11px; letter-spacing:.22em; color:#cbab87; text-transform:uppercase; }
    h1 { font-size:clamp(28px,5vw,42px); letter-spacing:-.04em; font-weight:650; margin:10px 0 12px; }
    p { color:#b9a9b9; line-height:1.55; }
    header p { max-width:470px; margin:0 auto; font-size:14px; }
    .stage { position:relative; height:350px; display:flex; align-items:flex-end; justify-content:center; }
    .pap { position:relative; width:288px; height:288px; background:transparent; padding:0; border:0; outline-offset:-16px; cursor:pointer; }
    .pap:focus-visible { outline:2px solid #e1b071; border-radius:30px; }
    canvas { width:100%; height:100%; position:relative; z-index:1; }
    .shadow { position:absolute; left:30%; width:59%; height:13px; bottom:18px; border-radius:50%; background:#05030786; filter:blur(6px); pointer-events:none; }
    .review { max-width:560px; margin:22px auto 0; border-top:1px solid #e9b27322; padding-top:20px; text-align:center; }
    .states { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 18px; }
    .states button { color:#c4acb5; font:inherit; font-size:12px; background:none; border:0; border-bottom:1px solid transparent; padding:8px 0; cursor:pointer; }
    .states button:hover, .states button[aria-pressed=true] { color:#efc38b; border-bottom-color:#e6a953; }
    .states button:focus-visible { outline:2px solid #e6a953; outline-offset:3px; }
    .status { font-size:12px; min-height:20px; margin:15px 0 0; color:#b7a4b7; }
    .tools { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:16px; color:#9e8b9e; font-size:11px; }
    .tools label { display:flex; align-items:center; gap:6px; cursor:pointer; }
    input { accent-color:#efc38b; }
    footer { text-align:center; font-size:11px; margin-top:28px; color:#927f92; }
    .small .pap { width:142px; height:142px; }
    .small .shadow { bottom:8px; height:7px; filter:blur(3px); }
    @media(max-width:460px) { main{padding:30px 16px;} .stage{height:300px;} .states{gap:2px 13px;} }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">PAP · Animation v3</div><h1>Ein kleiner Moment mit PAP.</h1><p>Ein Blick, ein Ohrzucken, ein freundlicher Gruß.<br>Tippe PAP an, um die kurze Folge zu sehen.</p></header>
  <section class="stage" aria-label="PAP Animationsvorschau">
    <button class="pap" aria-label="PAP begrüßen und Animationsfolge abspielen"><span class="shadow" aria-hidden="true"></span><canvas aria-hidden="true"></canvas></button>
  </section>
  <section class="review" aria-label="Animationen einzeln ansehen">
    <div class="states"><button data-state="demo" aria-pressed="false">Kurze Folge</button><button data-state="idle" aria-pressed="true">Ruhe</button><button data-state="greeting" aria-pressed="false">Begrüßung</button><button data-state="curious" aria-pressed="false">Zuhören</button><button data-state="thinking" aria-pressed="false">Nachdenken</button><button data-state="answer" aria-pressed="false">Antwort</button></div>
    <p class="status" role="status" aria-live="polite">PAP kommt gleich …</p>
    <div class="tools"><label><input type="checkbox" id="small">Kleine Companion-Größe</label><label><input type="checkbox" id="pause">Bewegung pausieren</label></div>
  </section>
  <footer>Eigenständige Animationsvorschau. Website-Chat als nächster Schritt.</footer>
</main>
<script type="module">
  import { PapAnimation } from './pap-player.js';
  const manifest = await fetch('./animation.json').then(r => { if (!r.ok) throw new Error('Animation fehlt'); return r.json(); });
  const player = new PapAnimation(document.querySelector('canvas'), manifest, { baseUrl:location.href });
  const status = document.querySelector('.status');
  const labels = {idle:'PAP ruht und schaut sich kurz um.',greeting:'PAP hebt die Pfote und winkt.',curious:'PAP hört aufmerksam zu.',thinking:'PAP denkt kurz nach.',answer:'PAP nickt dir zu.'};
  const buttons = [...document.querySelectorAll('[data-state]')];
  const pause = document.querySelector('#pause');
  let order = 0, selected = 'idle';
  function select(state) { buttons.forEach(b => b.setAttribute('aria-pressed',String(b.dataset.state === state))); }
  async function run(state) {
    selected = state; pause.checked = false; select(state);
    const token = ++order;
    if (state === 'demo') {
      const sequence = ['greeting','curious','answer','idle'];
      let i = 0;
      const next = () => {
        if (token !== order) return;
        const s = sequence[i++]; status.textContent = labels[s];
        player.play(s,{loop:s==='idle',onEnd:next}).catch(showError);
      };
      next();
    } else {
      status.textContent = labels[state];
      await player.play(state,{loop:state==='idle',onEnd:() => {
        if (token !== order) return;
        select('idle'); selected='idle'; status.textContent=labels.idle;
        player.play('idle',{loop:true}).catch(showError);
      }});
    }
  }
  function showError(error) { console.error(error); status.textContent='Die Animation konnte nicht geladen werden.'; }
  buttons.forEach(b => b.addEventListener('click',() => run(b.dataset.state).catch(showError)));
  document.querySelector('.pap').addEventListener('click',() => run('demo').catch(showError));
  document.querySelector('#small').addEventListener('change',e => document.querySelector('.stage').classList.toggle('small',e.target.checked));
  pause.addEventListener('change',() => {
    ++order;
    if(pause.checked){player.stop(); status.textContent='PAP bleibt kurz still.';}
    else run(selected).catch(showError);
  });
  if(player.reducedMotion){await player.play('idle'); status.textContent='Ruhige Darstellung gemäß deiner Bewegungseinstellung.';}
  else run('idle').catch(showError);
  window.addEventListener('pagehide',() => player.destroy(),{once:true});
</script>
</body>
</html>

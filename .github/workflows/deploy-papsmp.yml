name: Deploy PAP SMP to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'papsmp-website/**'
      - '.github/workflows/deploy-papsmp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-papsmp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: papsmp-website/.node-version
          cache: npm
          cache-dependency-path: papsmp-website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: papsmp-website

      - name: Check site
        run: npm run check
        working-directory: papsmp-website

      - name: Build site
        run: npm run build
        working-directory: papsmp-website

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: papsmp-website
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
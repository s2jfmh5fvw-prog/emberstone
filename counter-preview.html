<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Counter Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060406;
        --panel: #140d17;
        --panel-2: #1f1525;
        --accent: #f3cb70;
        --accent-2: #8f52e1;
        --text: #fdf4e0;
        --muted: #cbb8d8;
        --shadow: #030203;
        --pixel: #0e0a10;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'Press Start 2P', monospace;
        image-rendering: pixelated;
      }

      .preview-shell {
        width: min(100%, 1120px);
        display: grid;
        gap: 1.25rem;
        justify-items: center;
      }

      .counter-card {
        position: relative;
        width: min(100%, 960px);
        padding: 2.3rem 2.5rem 2.1rem;
        border: 4px solid rgba(255,255,255,0.12);
        border-radius: 0;
        background:
          linear-gradient(135deg, rgba(20, 13, 23, 0.97), rgba(10, 8, 13, 0.99));
        box-shadow:
          0 0 0 4px rgba(242,201,107,0.08),
          0 0 0 8px rgba(255,255,255,0.05),
          0 32px 90px rgba(0,0,0,0.45);
        overflow: hidden;
        backdrop-filter: blur(10px);
        image-rendering: pixelated;
      }

      .counter-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(242,201,107,0.08), transparent 30%, rgba(143,82,225,0.1) 70%, transparent);
        pointer-events: none;
      }

      .counter-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.04) 0, transparent 18%, transparent 82%, rgba(255,255,255,0.04) 100%),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 10px);
        opacity: 0.22;
        pointer-events: none;
      }

      .eyebrow {
        display: block;
        text-align: center;
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        color: var(--accent);
        margin-bottom: 1rem;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(242,201,107,0.18);
      }

      .banner-title {
        text-align: center;
        font-size: clamp(0.95rem, 2vw, 1.4rem);
        line-height: 1.6;
        margin: 0 0 0.9rem;
        color: var(--text);
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255,255,255,0.04);
      }

      .counter-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.95rem;
        margin: 1rem 0 0.9rem;
      }

      .counter-value {
        min-width: 3.9ch;
        text-align: center;
        padding: 1rem 0.95rem;
        border: 3px solid rgba(255,255,255,0.16);
        border-radius: 0.4rem;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.22));
        color: var(--text);
        box-shadow:
          inset 0 0 0 1px rgba(242,201,107,0.08),
          0 0 0 2px rgba(0,0,0,0.22),
          0 10px 24px rgba(0,0,0,0.25);
        text-shadow: 0 0 10px rgba(242,201,107,0.18);
        animation: valuePop 0.6s cubic-bezier(.2,.8,.2,1);
      }

      .counter-separator {
        font-size: 1.6rem;
        color: var(--accent);
        text-shadow: 0 0 10px rgba(242,201,107,0.22);
      }

      .counter-caption {
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        color: var(--muted);
        margin-top: 0.75rem;
        text-transform: uppercase;
      }

      .controls {
        display: flex;
        gap: 0.85rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        padding: 0.95rem 1.1rem;
        border: 3px solid rgba(242,201,107,0.28);
        border-radius: 0.4rem;
        background: linear-gradient(135deg, rgba(242,201,107,0.16), rgba(143,82,225,0.16));
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 0 0 2px rgba(0,0,0,0.2), 0 8px 22px rgba(0,0,0,0.22);
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, rgba(242,201,107,0.24), rgba(143,82,225,0.24));
        box-shadow: 0 0 0 2px rgba(0,0,0,0.2), 0 12px 28px rgba(0,0,0,0.24);
      }

      @keyframes valuePop {
        0% { transform: scale(0.84); opacity: 0.4; }
        100% { transform: scale(1); opacity: 1; }
      }

      @media (max-width: 640px) {
        .counter-card { padding: 1.5rem 1rem; }
        .counter-row { gap: 0.45rem; }
        .counter-value { padding: 0.8rem 0.7rem; }
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <div class="counter-card" aria-label="Early-Whitelist Counter">
        <span class="eyebrow">EMBERSTONE - SURVIVAL+</span>
        <h2 class="banner-title">EARLY-WHITELIST IST OFFEN</h2>
        <div class="counter-row">
          <span class="counter-value" id="current-slots">02</span>
          <span class="counter-separator">/</span>
          <span class="counter-value" id="total-slots">10</span>
        </div>
      </div>

      <div class="controls">
        <button id="replay-btn" type="button">ANIMATION NEU STARTEN</button>
      </div>
    </div>

    <script>
      const currentEl = document.getElementById('current-slots');
      const totalEl = document.getElementById('total-slots');
      const replayBtn = document.getElementById('replay-btn');

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function animateValue(el, target, duration = 900) {
        return new Promise((resolve) => {
          const start = Number(el.textContent);
          const startTime = performance.now();

          const tick = (now) => {
            const progress = Math.min((now - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const value = Math.round(start + (target - start) * eased);
            el.textContent = pad(value);

            if (progress < 1) {
              requestAnimationFrame(tick);
            } else {
              el.textContent = pad(target);
              resolve();
            }
          };

          requestAnimationFrame(tick);
        });
      }

      async function playAnimation() {
        currentEl.textContent = '00';
        totalEl.textContent = '00';
        await animateValue(currentEl, 2, 1000);
        await animateValue(totalEl, 10, 1000);
      }

      replayBtn.addEventListener('click', () => {
        playAnimation();
      });

      playAnimation();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Counter Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060406;
        --accent: #f3cb70;
        --accent-2: #8f52e1;
        --text: #fdf4e0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 1.4rem;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: 'Press Start 2P', monospace;
      }

      .frame {
        width: min(100%, 760px);
        padding: 1.2rem;
        border: 3px solid rgba(255,255,255,0.12);
        background: linear-gradient(135deg, rgba(20,13,23,0.98), rgba(10,8,13,0.99));
        box-shadow: 0 24px 70px rgba(0,0,0,0.4);
      }

      .counter-card {
        position: relative;
        padding: 1.6rem 1.4rem 1.4rem;
        border: 3px solid rgba(255,255,255,0.12);
        background: linear-gradient(135deg, rgba(20,13,23,0.97), rgba(10,8,13,0.99));
        overflow: hidden;
      }

      .counter-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(243,203,112,0.08), transparent 34%, rgba(143,82,225,0.08) 68%, transparent);
        pointer-events: none;
      }

      .eyebrow {
        display: block;
        text-align: center;
        font-size: 0.6rem;
        letter-spacing: 0.24em;
        color: var(--accent);
        margin-bottom: 0.75rem;
        text-transform: uppercase;
      }

      .banner-title {
        text-align: center;
        font-size: clamp(0.82rem, 1.8vw, 1.05rem);
        line-height: 1.55;
        margin: 0 0 0.8rem;
        text-transform: uppercase;
      }

      .counter-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
      }

      .counter-value {
        min-width: 3.6ch;
        text-align: center;
        padding: 0.82rem 0.75rem;
        border: 2px solid rgba(255,255,255,0.16);
        border-radius: 0.35rem;
        background: rgba(255,255,255,0.06);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(243,203,112,0.08);
      }

      .counter-separator {
        color: var(--accent);
        font-size: 1.3rem;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="counter-card">
        <span class="eyebrow">EMBERSTONE - SURVIVAL+</span>
        <h2 class="banner-title">EARLY-WHITELIST IST OFFEN</h2>
        <div class="counter-row">
          <span class="counter-value">02</span>
          <span class="counter-separator">/</span>
          <span class="counter-value">10</span>
        </div>
      </div>
    </div>
  </body>
</html>
